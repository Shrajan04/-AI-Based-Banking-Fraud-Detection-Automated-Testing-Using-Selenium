name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend

  browser:
    name: Selenium end-to-end tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: browser-actions/setup-chrome@v1
      - run: npm ci
        working-directory: backend
      - name: Seed test database
        run: npm run seed
        working-directory: backend
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/banking_fraud_ci
          TEST_MODE: 'true'
      - name: Start application
        run: |
          npm start > app.log 2>&1 &
          echo $! > app.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/test/status; then
              exit 0
            fi
            sleep 2
          done
          cat app.log
          exit 1
        working-directory: backend
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/banking_fraud_ci
          TEST_MODE: 'true'
          SESSION_SECRET: ci-only-session-secret
      - name: Run browser suite
        run: npm run test:e2e
        working-directory: backend
      - name: Show server log on failure
        if: failure()
        run: cat backend/app.log
