<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FraudGuard Bank</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header">
    <div class="brand"><a href="index.html" style="color:#fff;text-decoration:none">FraudGuard Bank</a></div>
    <div class="nav">
      <a href="register.html">Register</a>
      <a href="admin-login.html" id="adminLoginLink">Admin Login</a>
    </div>
  </div>

  <div class="container narrow">
    <div class="card">
      <h1 id="loginHeading">Customer Login</h1>
      <div id="loginMessage" class="message"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginUsername">Username</label>
          <input type="text" id="loginUsername" name="username" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" name="password" autocomplete="current-password">
        </div>
        <button type="submit" class="btn" id="loginButton">Login</button>
      </form>

      <div class="links">
        <a href="register.html" id="registerLink">Register</a>
        <a href="forgot-password.html" id="forgotPasswordLink">Forgot Password?</a>
      </div>
    </div>
  </div>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
