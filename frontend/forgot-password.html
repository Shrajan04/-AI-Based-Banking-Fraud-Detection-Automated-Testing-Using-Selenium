<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - FraudGuard Bank</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header">
    <div class="brand"><a href="index.html" style="color:#fff;text-decoration:none">FraudGuard Bank</a></div>
    <div class="nav"><a href="login.html" id="backToLoginLink">Back to Login</a></div>
  </div>

  <div class="container narrow">
    <div class="card">
      <h1>Forgot Password</h1>
      <div id="forgotMessage" class="message"></div>
      <form id="forgotForm" novalidate>
        <div class="form-group">
          <label for="forgotUsername">Username or Email</label>
          <input type="text" id="forgotUsername">
        </div>
        <button type="submit" class="btn" id="forgotButton">Send Reset Link</button>
      </form>
      <p class="hint">Demo page only. No email is sent in this project.</p>
    </div>
  </div>
  <script src="js/common.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const value = document.getElementById('forgotUsername').value.trim();
      if (!value) {
        showMessage('forgotMessage', 'Please enter your username or email.', 'error');
      } else {
        showMessage('forgotMessage', 'Password reset is not available in this demo. Please contact the administrator.', 'warning');
      }
    });
  </script>
</body>
</html>
