<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - FraudGuard Bank</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header">
    <div class="brand"><a href="index.html" style="color:#fff;text-decoration:none">FraudGuard Bank</a> <small>Admin</small></div>
    <div class="nav">
      <a href="login.html" id="customerLoginLink">Customer Login</a>
    </div>
  </div>

  <div class="container narrow">
    <div class="card">
      <h1 id="adminLoginHeading">Admin Login</h1>
      <div id="adminLoginMessage" class="message"></div>

      <form id="adminLoginForm" novalidate>
        <div class="form-group">
          <label for="adminUsername">Admin Username</label>
          <input type="text" id="adminUsername" name="username">
        </div>
        <div class="form-group">
          <label for="adminPassword">Password</label>
          <input type="password" id="adminPassword" name="password">
        </div>
        <button type="submit" class="btn" id="adminLoginButton">Login as Admin</button>
      </form>
    </div>
  </div>
  <script src="js/common.js"></script>
  <script src="js/admin-login.js"></script>
</body>
</html>
